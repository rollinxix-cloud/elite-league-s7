<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ELITE LEAGUE S7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        :root {
            --text-title: #ccff00;
            --text-main: #f3f4f6;
            --bg-card: rgba(17, 24, 39, 0.85);
            --border-color: rgba(55, 65, 81, 0.7);
        }

        body {
            background: linear-gradient(135deg, rgba(7, 11, 25, 0.95) 0%, rgba(13, 20, 38, 0.85) 100%), 
                        url('https://images.unsplash.com/photo-1518605368461-1ee7c532066d?q=80&w=2070&auto=format&fit=crop') center center / cover fixed !important;
            color: var(--text-main) !important;
            -webkit-font-smoothing: antialiased;
            backdrop-filter: blur(2px);
        }

        .theme-card {
            background-color: var(--bg-card) !important;
            border: 1px solid var(--border-color) !important;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
        }
        
        .main-title {
            color: var(--text-title) !important;
            text-shadow: 0 0 15px rgba(204, 255, 0, 0.3);
        }

        [contenteditable="true"]:focus {
            background-color: rgba(59, 130, 246, 0.3);
            outline: 1px solid #3b82f6;
            border-radius: 4px;
            color: #fff;
        }
        [contenteditable="true"] {
            cursor: text;
            border-bottom: 1px dashed rgba(255,255,255,0.2);
        }
        
        ::-webkit-scrollbar { height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-card); }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
</head>
<body class="p-2 md:p-6 font-sans">
    
    <div class="max-w-7xl mx-auto space-y-4 md:space-y-6">

        <!-- ADMIN EXPORT BUTTON -->
        <div id="admin-panel" class="hidden justify-center mb-4">
            <button onclick="exportHTML()" class="bg-blue-600 hover:bg-blue-500 border border-blue-400 text-white font-bold py-3 px-6 rounded-xl shadow-[0_0_15px_rgba(37,99,235,0.5)] transition duration-200 uppercase tracking-widest text-sm flex items-center gap-2 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>
                💾 Save Changes (Export HTML)
            </button>
        </div>
        
        <!-- HEADER SECTION -->
        <header class="text-center p-4 md:p-6 rounded-xl theme-card flex flex-col items-center justify-center gap-2">
            <h1 class="text-3xl md:text-5xl font-black uppercase tracking-widest main-title drop-shadow-md">
                Elite League S7
            </h1>
        </header>

        <!-- MAIN LAYOUT GRID -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- STANDINGS TABLE -->
            <div class="lg:col-span-2">
                <section class="theme-card rounded-xl overflow-hidden">
                    <div class="p-3 md:p-4 bg-black/50 border-b border-gray-700 flex justify-between items-center">
                        <h2 class="text-base md:text-lg font-bold text-white uppercase tracking-wider flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                            Live Standings
                        </h2>
                    </div>

                    <div class="w-full overflow-x-auto">
                        <table class="w-full text-left whitespace-nowrap text-xs md:text-sm" id="league-table">
                            <thead class="bg-black/60 text-gray-400 uppercase font-bold border-b border-gray-700">
                                <tr>
                                    <th class="px-2 py-3 text-center w-8">#</th>
                                    <th class="px-2 py-3 text-left">Team / Player</th>
                                    <th class="px-2 py-3 text-center" title="Matches Played">MP</th>
                                    <th class="px-2 py-3 text-center text-green-400">W</th>
                                    <th class="px-2 py-3 text-center text-yellow-400">D</th>
                                    <th class="px-2 py-3 text-center text-red-400">L</th>
                                    <th class="px-2 py-3 text-center hidden sm:table-cell" title="Goals For">GF</th>
                                    <th class="px-2 py-3 text-center hidden sm:table-cell" title="Goals Against">GA</th>
                                    <th class="px-2 py-3 text-center" title="Goal Difference">GD</th>
                                    <th class="px-3 py-3 text-center text-[var(--text-title)] text-sm md:text-base">PTS</th>
                                </tr>
                            </thead>
                            <tbody id="league-table-body" class="divide-y divide-gray-800/60 font-medium">
                                <!-- Managed dynamically by structural initialization core -->
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>

            <!-- FIXTURES MODULE WITH SELECTABLE MATCHDAYS -->
            <div class="lg:col-span-1">
                <section class="theme-card rounded-xl overflow-hidden flex flex-col h-full max-h-[85vh]">
                    <div class="p-3 md:p-4 bg-black/50 border-b border-gray-700 flex flex-col gap-2">
                        <div class="flex justify-between items-center">
                            <h2 class="text-base md:text-lg font-bold text-white uppercase tracking-wider flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-[var(--text-title)]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                                Fixtures Matrix
                            </h2>
                        </div>
                        
                        <!-- Dropdown Selector for Matchdays -->
                        <div>
                            <label for="matchday-select" class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-1">Select Schedule Stage</label>
                            <select id="matchday-select" onchange="switchMatchday()" class="w-full bg-gray-950 border border-gray-700 text-white rounded-lg p-2 text-xs font-bold focus:outline-none focus:ring-1 focus:ring-blue-500">
                                <option value="md-1">MATCHDAY 1 OF 17</option>
                                <option value="md-2">MATCHDAY 2 OF 17</option>
                                <option value="md-3">MATCHDAY 3 OF 17</option>
                                <option value="md-4">MATCHDAY 4 OF 17</option>
                                <option value="md-5">MATCHDAY 5 OF 17</option>
                                <option value="md-6">MATCHDAY 6 OF 17</option>
                                <option value="md-7">MATCHDAY 7 OF 17</option>
                                <option value="md-8">MATCHDAY 8 OF 17</option>
                                <option value="md-9">MATCHDAY 9 OF 17</option>
                                <option value="md-10">MATCHDAY 10 OF 17</option>
                                <option value="md-11">MATCHDAY 11 OF 17</option>
                                <option value="md-12">MATCHDAY 12 OF 17</option>
                                <option value="md-13">MATCHDAY 13 OF 17</option>
                                <option value="md-14">MATCHDAY 14 OF 17</option>
                                <option value="md-15">MATCHDAY 15 OF 17</option>
                                <option value="md-16">MATCHDAY 16 OF 17</option>
                                <option value="md-17">MATCHDAY 17 OF 17</option>
                            </select>
                        </div>
                    </div>

                    <!-- Scrollable Container containing all 17 Matchdays -->
                    <div class="p-3 space-y-3 overflow-y-auto flex-1 bg-black/20" id="fixtures-root">
                        <!-- Managed dynamically by structural initialization core -->
                    </div>
                </section>
            </div>

        </div>
    </div>

    <!-- SECURITY MODAL -->
    <div id="adminAuthModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-700 rounded-xl p-6 max-w-sm w-full shadow-2xl space-y-4">
            <h3 class="text-xl font-bold tracking-wide text-white">System Verification</h3>
            <p class="text-xs text-gray-400">Enter secure operator key parameters to unlock league updates desk.</p>
            <input type="password" id="adminPasswordInput" class="w-full p-3 rounded-lg border border-gray-700 bg-gray-950 text-white font-mono focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
            <div id="authErrorMessage" class="text-red-400 text-xs hidden font-medium">Invalid security credentials.</div>
            <div class="flex justify-end gap-2 text-xs">
                <button onclick="closeAdminAuthModal()" class="px-4 py-2 text-gray-400 hover:bg-gray-800 rounded-lg cursor-pointer">Cancel</button>
                <button onclick="submitAdminAuth()" class="px-4 py-2 text-white bg-blue-600 hover:bg-blue-500 rounded-lg font-bold cursor-pointer">Verify</button>
            </div>
        </div>
    </div>

    <!-- DISCREET ADMIN PANEL TRIGGER BUTTON -->
    <button onclick="openAdminAuthModal()" class="fixed bottom-5 right-5 bg-black/40 hover:bg-black/80 text-gray-500 hover:text-[var(--text-title)] border border-gray-800 hover:border-gray-600 transition-all p-3 rounded-xl z-50 cursor-pointer shadow-lg" title="Workspace Access">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
    </button>

    <script>
        function switchMatchday() {
            const selectedVal = document.getElementById('matchday-select').value;
            document.querySelectorAll('.matchday-group').forEach(group => {
                group.classList.add('hidden');
            });
            const activeGroup = document.getElementById(selectedVal);
            if (activeGroup) activeGroup.classList.remove('hidden');
        }

        function setupInitialLayout() {
            const tbody = document.getElementById('league-table-body');
            const fixturesRoot = document.getElementById('fixtures-root');
            
            const zones = {
                1: { class: "bg-green-900/20 text-green-400", bgClass: "bg-green-900/10" },
                2: { class: "bg-green-900/10 text-green-500", bgClass: "bg-green-900/5" },
                16: { class: "bg-red-900/20 text-red-500", bgClass: "bg-red-900/10" },
                17: { class: "bg-red-900/20 text-red-500", bgClass: "bg-red-900/10" },
                18: { class: "bg-red-900/20 text-red-500", bgClass: "bg-red-900/10" }
            };

            const registeredPlayers = [
                "Namsang Subba", "बसन्त खड्का", "Siv Sunar", "Binaya Shrestha",
                "Ashman Titung", "Hab II", "Roshan B. Magar", "Subash Tamang",
                "Player 9", "Player 10", "Player 11", "Player 12",
                "Player 13", "Player 14", "Player 15", "Player 16",
                "Player 17", "Player 18"
            ];

            let tableHtml = '';
            for (let i = 1; i <= 18; i++) {
                let zone = zones[i] || { class: "text-gray-500", bgClass: "" };
                let playerName = registeredPlayers[i - 1];
                tableHtml += `
                <tr class="hover:bg-gray-800/60 transition duration-150 ${zone.bgClass}">
                    <td class="px-2 py-3 text-center font-bold ${zone.class}">${i}</td>
                    <td class="px-2 py-3 max-w-[120px] md:max-w-xs truncate edit-name text-white" contenteditable="false">${playerName}</td>
                    <td class="px-2 py-3 text-center calc-mp text-gray-300">0</td>
                    <td class="px-2 py-3 text-center text-green-300 edit-w" contenteditable="false">0</td>
                    <td class="px-2 py-3 text-center text-yellow-300 edit-d" contenteditable="false">0</td>
                    <td class="px-2 py-3 text-center text-red-300 edit-l" contenteditable="false">0</td>
                    <td class="px-2 py-3 text-center text-gray-400 hidden sm:table-cell edit-gf" contenteditable="false">0</td>
                    <td class="px-2 py-3 text-center text-gray-400 hidden sm:table-cell edit-ga" contenteditable="false">0</td>
                    <td class="px-2 py-3 text-center calc-gd text-gray-300">0</td>
                    <td class="px-3 py-3 text-center font-bold text-white text-sm md:text-base calc-pts">0</td>
                </tr>`;
            }
            tbody.innerHTML = tableHtml;

            const totalTeams = 18;
            let teams = Array.from({length: totalTeams}, (_, i) => i + 1);
            let fixturesHtml = '';

            for (let round = 1; round <= 17; round++) {
                fixturesHtml += `<div id="md-${round}" class="matchday-group ${round === 1 ? '' : 'hidden'} space-y-3">`;
                
                for (let matchIdx = 0; matchIdx < totalTeams / 2; matchIdx++) {
                    let home = teams[matchIdx];
                    let away = teams[totalTeams - 1 - matchIdx];
                    
                    if (round % 2 === 0) {
                        let temp = home; home = away; away = temp;
                    }

                    fixturesHtml += `
                    <div class="p-3 bg-gray-900/60 rounded-lg border border-gray-800 flex flex-col gap-1.5">
                        <div class="flex justify-between text-[9px] text-gray-500 font-bold uppercase tracking-wider">
                            <span>ROUND ${round} • MATCH ${matchIdx + 1}</span>
                            <span class="edit-status text-yellow-500" contenteditable="false">UPCOMING</span>
                        </div>
                        <div class="flex items-center justify-between gap-2">
                            <div class="flex-1 text-xs font-semibold truncate text-white edit-home-name" contenteditable="false">Player ${home}</div>
                            <div class="flex items-center bg-black/40 rounded border border-gray-700 px-2 py-1 text-xs font-bold gap-1">
                                <span class="w-5 text-center text-green-400 edit-score-h" contenteditable="false">-</span>
                                <span class="text-gray-600">:</span>
                                <span class="w-5 text-center text-green-400 edit-score-a" contenteditable="false">-</span>
                            </div>
                            <div class="flex-1 text-right text-xs font-semibold truncate text-white edit-away-name" contenteditable="false">Player ${away}</div>
                        </div>
                    </div>`;
                }
                fixturesHtml += `</div>`;
                teams.splice(1, 0, teams.pop());
            }
            fixturesRoot.innerHTML = fixturesHtml;
        }

        function bindAutoCalc() {
            document.querySelectorAll('#league-table-body tr').forEach(row => {
                const wCell = row.querySelector('.edit-w');
                const dCell = row.querySelector('.edit-d');
                const lCell = row.querySelector('.edit-l');
                const gfCell = row.querySelector('.edit-gf');
                const gaCell = row.querySelector('.edit-ga');
                const mpCell = row.querySelector('.calc-mp');
                const gdCell = row.querySelector('.calc-gd');
                const ptsCell = row.querySelector('.calc-pts');

                const calculate = () => {
                    const w = parseInt(wCell.innerText) || 0;
                    const d = parseInt(dCell.innerText) || 0;
                    const l = parseInt(lCell.innerText) || 0;
                    const gf = parseInt(gfCell.innerText) || 0;
                    const ga = parseInt(gaCell.innerText) || 0;

                    mpCell.innerText = w + d + l;
                    const gd = gf - ga;
                    gdCell.innerText = gd > 0 ? "+" + gd : gd;
                    ptsCell.innerText = (w * 3) + (d * 1);
                };

                [wCell, dCell, lCell, gfCell, gaCell].forEach(cell => {
                    cell.addEventListener('input', calculate);
                    cell.addEventListener('keypress', function(e) {
                        if (isNaN(String.fromCharCode(e.which))) e.preventDefault();
                    });
                });
            });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            if (!document.body.classList.contains('layout-initialized')) {
                setupInitialLayout();
                document.body.classList.add('layout-initialized');
            }
            bindAutoCalc();
        });

        function openAdminAuthModal() {
            document.getElementById('adminAuthModal').classList.remove('hidden');
            document.getElementById('adminPasswordInput').focus();
            document.getElementById('authErrorMessage').classList.add('hidden');
        }

        function closeAdminAuthModal() {
            document.getElementById('adminAuthModal').classList.add('hidden');
            document.getElementById('adminPasswordInput').value = '';
        }

        function submitAdminAuth() {
            const passwordInputValue = document.getElementById('adminPasswordInput').value;
            const errorContainer = document.getElementById('authErrorMessage');
            
            if (passwordInputValue === 'EDN2026') {
                closeAdminAuthModal();
                const adminPanel = document.getElementById('admin-panel');
                adminPanel.classList.remove('hidden');
                adminPanel.classList.add('flex');
                
                document.querySelectorAll('.edit-name, .edit-w, .edit-d, .edit-l, .edit-gf, .edit-ga, .edit-home-name, .edit-away-name, .edit-score-h, .edit-score-a, .edit-status').forEach(cell => {
                    cell.contentEditable = "true";
                });
                adminPanel.scrollIntoView({ behavior: 'smooth' });
            } else {
                errorContainer.classList.remove('hidden');
            }
        }

        document.getElementById('adminPasswordInput').addEventListener('keypress', function (event) {
            if (event.key === 'Enter') submitAdminAuth();
        });

        function exportHTML() {
            document.getElementById('matchday-select').value = "md-1";
            switchMatchday();

            const adminPanel = document.getElementById('admin-panel');
            adminPanel.classList.remove('flex');
            adminPanel.classList.add('hidden');
            
            document.querySelectorAll('.edit-name, .edit-w, .edit-d, .edit-l, .edit-gf, .edit-ga, .edit-home-name, .edit-away-name, .edit-score-h, .edit-score-a, .edit-status').forEach(cell => {
                cell.contentEditable = "false";
            });

            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'index.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            adminPanel.classList.remove('hidden');
            adminPanel.classList.add('flex');
            document.querySelectorAll('.edit-name, .edit-w, .edit-d, .edit-l, .edit-gf, .edit-ga, .edit-home-name, .edit-away-name, .edit-score-h, .edit-score-a, .edit-status').forEach(cell => {
                cell.contentEditable = "true";
            });

            alert("File downloaded successfully! Run push.bat to deploy.");
        }
    </script>
</body>
</html>
